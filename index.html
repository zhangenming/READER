<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>原文阅读器</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link
      id="默认文本预加载"
      rel="preload"
      href="./txt/嫌疑人X的献身 (东野圭吾) (z-library.sk, 1lib.sk, z-lib.sk).txt"
      as="fetch"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css?v=20260728-8" />
  </head>
  <body>
    <main class="阅读区域">
      <div id="滚动容器" class="滚动容器" tabindex="0" aria-label="正文">
        <div id="虚拟画布" class="虚拟画布">
          <div
            id="可见内容"
            class="可见内容"
            role="document"
            aria-label="文本内容"
          ></div>
        </div>
        <div id="载入状态" class="载入状态" role="status">
          <span class="载入线" aria-hidden="true"></span>
          <p>正在打开《香农传》</p>
        </div>
      </div>
    </main>
    <div
      id="自定义滚动条"
      class="自定义滚动条"
      role="scrollbar"
      aria-label="阅读进度"
      aria-controls="滚动容器"
      aria-orientation="vertical"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      tabindex="0"
      hidden
    >
      <canvas
        id="关键词指示器"
        class="关键词指示器"
        aria-hidden="true"
        hidden
      ></canvas>
      <div id="滚动块" class="滚动块" aria-hidden="true"></div>
    </div>
    <canvas
      id="悬停关键词指示器"
      class="关键词指示器 悬停关键词指示器"
      aria-hidden="true"
      hidden
    ></canvas>
    <span id="滚动进度" class="滚动进度" aria-hidden="true" hidden>0.0%</span>
    <button
      id="自动滚动按钮"
      class="自动滚动按钮"
      type="button"
      aria-pressed="false"
    >
      <span>滚动</span>
      <span id="自动滚动速度" class="自动滚动速度">36</span>
    </button>
    <time id="当前时间" class="当前时间">00:00:00</time>
    <div id="跳转边框" class="跳转边框" aria-hidden="true" hidden></div>
    <div id="跳转迸发" class="跳转迸发" aria-hidden="true" hidden></div>

    <dialog id="查找弹窗" class="查找弹窗" aria-labelledby="查找标题">
      <form id="查找表单" class="查找表单">
        <div class="查找标题栏">
          <label id="查找标题" for="查找输入框">查找正文</label>
          <button
            id="关闭查找按钮"
            class="关闭查找按钮"
            type="button"
            aria-label="关闭查找"
            title="关闭"
          >
            ×
          </button>
        </div>
        <div class="查找输入行">
          <input
            id="查找输入框"
            class="查找输入框"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="输入关键词"
            aria-describedby="查找反馈"
          />
          <button class="提交查找按钮" type="submit">查找</button>
          <button id="分析按钮" class="分析按钮" type="button">分析</button>
        </div>
        <p id="查找反馈" class="查找反馈" role="status" aria-live="polite"></p>
        <section id="分析结果" class="分析结果" aria-live="polite" hidden>
          <p id="分析结果摘要" class="分析结果摘要"></p>
          <div class="分析表格容器">
            <table class="分析表格">
              <thead>
                <tr>
                  <th scope="col">词组</th>
                  <th scope="col">数量</th>
                </tr>
              </thead>
              <tbody id="分析结果列表"></tbody>
            </table>
          </div>
        </section>
      </form>
    </dialog>

    <script src="./app.js?v=20260728-10" defer></script>
  </body>
</html>
