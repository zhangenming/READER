<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>原文阅读器</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preload" href="./txt/白鹿原.txt" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles.css?v=20260726-1" />
  </head>
  <body>
    <main class="阅读区域">
      <div id="滚动容器" class="滚动容器" tabindex="0" aria-label="正文">
        <div id="虚拟画布" class="虚拟画布">
          <div
            id="可见内容"
            class="可见内容"
            role="document"
            aria-label="文本内容"
          ></div>
        </div>
        <div id="载入状态" class="载入状态" role="status">
          <span class="载入线" aria-hidden="true"></span>
          <p>正在打开《香农传》</p>
        </div>
      </div>
    </main>
    <div id="跳转边框" class="跳转边框" aria-hidden="true" hidden></div>

    <dialog id="查找弹窗" class="查找弹窗" aria-labelledby="查找标题">
      <form id="查找表单" class="查找表单">
        <div class="查找标题栏">
          <label id="查找标题" for="查找输入框">查找正文</label>
          <button
            id="关闭查找按钮"
            class="关闭查找按钮"
            type="button"
            aria-label="关闭查找"
            title="关闭"
          >
            ×
          </button>
        </div>
        <div class="查找输入行">
          <input
            id="查找输入框"
            class="查找输入框"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="输入关键词"
            aria-describedby="查找反馈"
          />
          <button class="提交查找按钮" type="submit">查找</button>
          <button id="分析按钮" class="分析按钮" type="button">分析</button>
        </div>
        <p id="查找反馈" class="查找反馈" role="status" aria-live="polite"></p>
        <section id="分析结果" class="分析结果" aria-live="polite" hidden>
          <p id="分析结果摘要" class="分析结果摘要"></p>
          <div class="分析表格容器">
            <table class="分析表格">
              <thead>
                <tr>
                  <th scope="col">词组</th>
                  <th scope="col">数量</th>
                </tr>
              </thead>
              <tbody id="分析结果列表"></tbody>
            </table>
          </div>
        </section>
      </form>
    </dialog>

    <script src="./app.js?v=20260726-2" defer></script>
  </body>
</html>
